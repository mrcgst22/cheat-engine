name: Build Cheat Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Lazarus
      uses: g3neration/setup-lazarus@v1
      with:
        lazarus-version: '2.2.6'

    - name: Build Cheat Engine
      run: |
        cd "Cheat Engine"
        lazbuild cheatengine.lpi --build-mode="Release x86_64"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CheatEngine-Executable
        path: |
          Cheat Engine/bin/cheatengine-x86_64.exe
          Cheat Engine/bin/*.dll
